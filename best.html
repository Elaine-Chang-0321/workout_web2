<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Bests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .fun-font{font-family:'Baloo 2',cursive;}
  </style>
<style>
  /* Flip 基本設定 */
  .flip { perspective: 1000px; }
  .flip-inner {
    position: relative;
    transform-style: preserve-3d;
    transition: transform .6s;
    border-radius: 1rem; /* 和原卡片圓角一致 */
    overflow: hidden;
  }
  /* 加上 .is-flipped 時翻轉 */
  .flip.is-flipped .flip-inner { transform: rotateY(180deg); }

  .flip-front, .flip-back {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flip-front {
    position: relative;
  }
  .flip-back {
    position: absolute;
    inset: 0;
    transform: rotateY(180deg);
    display: flex;
  }
  .flip-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="w-full bg-white shadow-sm py-4 px-6 md:px-12 flex items-center justify-between">
    <div class="fun-font text-2xl md:text-3xl font-extrabold text-[#1F2A37] select-none">
      Let’s workout!
    </div>
    <a href="index.html"
       class="bg-[#1F1F1F] text-white font-semibold px-6 py-2 rounded-full hover:bg-[#151515] active:scale-[0.97] transition">
       Home
    </a>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8 md:py-12">
    <!-- Toolbar -->
    <section class="mb-6 flex flex-col md:flex-row md:items-center gap-3">
      <input id="searchInput" type="search" placeholder="Search exercise..."
             class="w-full md:w-80 h-11 rounded-xl border border-slate-200 px-4 focus:outline-none focus:ring-4 focus:ring-indigo-200"/>
      <select id="sortSelect"
              class="h-11 rounded-xl border border-slate-200 px-3 focus:outline-none focus:ring-4 focus:ring-indigo-200">
        <option value="weight_desc">Sort: Weight (High → Low)</option>
        <option value="weight_asc">Sort: Weight (Low → High)</option>
        <option value="alpha_asc">Sort: A → Z</option>
        <option value="alpha_desc">Sort: Z → A</option>
        <option value="date_desc">Sort: Newest</option>
        <option value="date_asc">Sort: Oldest</option>
      </select>
    </section>

    <!-- Cards grid -->
    <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- JS inject -->
    </section>

    <!-- Empty -->
    <p id="emptyState" class="hidden text-center text-slate-400 mt-10">No data yet.</p>
  </main>

  <script>
    // 固定 API 網址
    const API_BASE = "https://workout-api.zeabur.app";

    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    let rawData = [];

    function fmtDate(d){
      if(!d) return "";
      try { return new Date(d).toISOString().slice(0,10); }
      catch { return d || ""; }
    }

function card(ex, heroImg) {
  return `
    <div class="flip group cursor-pointer" role="button" tabindex="0" aria-pressed="false">
      <div class="flip-inner bg-white shadow hover:shadow-lg transition">

        <!-- Front：原本的卡片內容 -->
        <div class="flip-front">
          <article class="relative overflow-hidden">
            <!-- 正面上方：使用傳入的 heroImg -->
            <div class="h-36 bg-cover bg-center" style="background-image: url('${heroImg}');"></div>
            <div class="p-5">
              <h3 class="text-xl font-extrabold text-slate-800 mb-1">${ex.exercise}</h3>
              <p class="text-5xl font-extrabold tracking-tight text-slate-900 mb-2">
                ${ex.weight_kg ? Math.round(ex.weight_kg) : "-"}<span class="text-2xl font-bold text-slate-500"> kg</span>
              </p>
              <p class="text-sm text-slate-500">
                ${fmtDate(ex.date)}${ex.reps ? ` · ${ex.reps} reps` : "" }
              </p>
              <div class="mt-4 flex gap-2">
                <a href="workout.html"
                   class="inline-flex items-center px-3 py-1.5 text-sm rounded-full border border-slate-300 text-slate-700 hover:bg-slate-50">
                   Log more
                </a>
                <a href="#" onclick="viewDetail('${encodeURIComponent(ex.exercise)}'); return false;"
                   class="inline-flex items-center px-3 py-1.5 text-sm rounded-full bg-slate-900 text-white hover:bg-black">
                   View details
                </a>
              </div>
            </div>
          </article>
        </div>

        <!-- Back：整張覆蓋 card.png -->
        <div class="flip-back">
          <img src="card.png" alt="card back">
        </div>

      </div>
    </div>
  `;
}

function render(list) {
  // 每次渲染前重置，讓這一輪的相鄰卡片不重複
  lastPicIndex = -1;

  const html = list.map(ex => {
    const hero = pickHeroImage(); // 取得本張的頭圖
    return card(ex, hero);
  }).join("");

  grid.innerHTML = html;
  emptyState.classList.toggle("hidden", list.length > 0);
}

    function filterAndSort() {
      let list = [...rawData];
    // 圖片池與「上一次使用的索引」；會確保相鄰不重複
    const PIC_COUNT = 10;
    let lastPicIndex = -1;

    // 回傳 pic1.png ~ pic10.png，且不會與上一張相同
    function pickHeroImage() {
      let idx;
      do {
        idx = Math.floor(Math.random() * PIC_COUNT); // 0 ~ 9
      } while (idx === lastPicIndex);
      lastPicIndex = idx;
      return `pic${idx + 1}.png`;
    }
      const q = (searchInput.value || "").trim().toLowerCase();
      if (q) list = list.filter(x => (x.exercise || "").toLowerCase().includes(q));

      switch (sortSelect.value) {
        case "weight_asc":  list.sort((a,b)=>(a.weight_kg??0)-(b.weight_kg??0)); break;
        case "alpha_asc":   list.sort((a,b)=>String(a.exercise).localeCompare(String(b.exercise))); break;
        case "alpha_desc":  list.sort((a,b)=>String(b.exercise).localeCompare(String(a.exercise))); break;
        case "date_asc":    list.sort((a,b)=>new Date(a.date)-new Date(b.date)); break;
        case "date_desc":   list.sort((a,b)=>new Date(b.date)-new Date(a.date)); break;
        default:            list.sort((a,b)=>(b.weight_kg??0)-(a.weight_kg??0));
      }
      render(list);
    }

    async function load() {
      grid.innerHTML = `<div class="col-span-full text-center text-slate-400">Loading...</div>`;
      try {
        const r = await fetch(`${API_BASE}/api/bests`);
        if(!r.ok) throw new Error(await r.text());
        rawData = await r.json();
      } catch (e) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-600">Failed to load: ${e.message}</div>`;
        return;
      }
      filterAndSort();
    }

    // 彈窗顯示單一動作明細（可後續改成獨立頁面）
    async function viewDetail(name){
      try {
        const r = await fetch(`${API_BASE}/api/bests/${name}`);
        if(!r.ok) throw new Error(await r.text());
        const rows = await r.json();
        alert(`${decodeURIComponent(name)}\n` +
          rows.map(r => `${fmtDate(r.date)} - ${r.weight_kg}kg x ${r.reps ?? '-'}`).join('\n')
        );
      } catch (e) {
        alert(`Failed: ${e.message}`);
      }
    }

    searchInput.addEventListener("input", filterAndSort);
    sortSelect.addEventListener("change", filterAndSort);
    load();

    // 點擊卡片本體翻面（點擊連結則不翻）
    grid.addEventListener("click", (e) => {
      if (e.target.closest("a")) return; // 點到連結就不要翻
      const host = e.target.closest(".flip");
      if (!host) return;
      host.classList.toggle("is-flipped");
      host.setAttribute("aria-pressed", host.classList.contains("is-flipped") ? "true" : "false");
    });

    // 鍵盤可達性：Enter 或 Space 翻面
    grid.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const host = e.target.closest(".flip");
      if (!host) return;
      e.preventDefault();
      host.classList.toggle("is-flipped");
      host.setAttribute("aria-pressed", host.classList.contains("is-flipped") ? "true" : "false");
    });
  </script>
</body>
</html>
