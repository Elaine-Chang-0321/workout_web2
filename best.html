<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Bests</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .fun-font{font-family:'Baloo 2',cursive;}

    /* 卡片翻面效果 */
    .flip-card {
      perspective: 1000px;
      cursor: pointer;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1rem;
      overflow: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="w-full bg-white shadow-sm py-4 px-6 md:px-12 flex items-center justify-between">
    <div class="fun-font text-2xl md:text-3xl font-extrabold text-[#1F2A37] select-none">
      Let’s workout!
    </div>
    <a href="index.html"
       class="bg-[#1F1F1F] text-white font-semibold px-6 py-2 rounded-full hover:bg-[#151515] active:scale-[0.97] transition">
       Home
    </a>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8 md:py-12">
    <section class="mb-6 flex flex-col md:flex-row md:items-center gap-3">
      <input id="searchInput" type="search" placeholder="Search exercise..."
             class="w-full md:w-80 h-11 rounded-xl border border-slate-200 px-4 focus:outline-none focus:ring-4 focus:ring-indigo-200"/>
      <select id="sortSelect"
              class="h-11 rounded-xl border border-slate-200 px-3 focus:outline-none focus:ring-4 focus:ring-indigo-200">
        <option value="weight_desc">Sort: Weight (High → Low)</option>
        <option value="weight_asc">Sort: Weight (Low → High)</option>
        <option value="alpha_asc">Sort: A → Z</option>
        <option value="alpha_desc">Sort: Z → A</option>
        <option value="date_desc">Sort: Newest</option>
        <option value="date_asc">Sort: Oldest</option>
      </select>
    </section>

    <!-- Cards grid -->
    <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></section>
    <p id="emptyState" class="hidden text-center text-slate-400 mt-10">No data yet.</p>
  </main>

  <script>
    const API_BASE = "https://workout-api.zeabur.app";
    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    let rawData = [];

    function fmtDate(d){
      if(!d) return "";
      try { return new Date(d).toISOString().slice(0,10); }
      catch { return d || ""; }
    }

    function card(ex) {
      const randomPic = `pic${Math.floor(Math.random() * 10) + 1}.png`;
      const front = `
        <div class="flip-card-front bg-white shadow">
          <div class="h-36 bg-cover bg-center" style="background-image: url('${randomPic}');"></div>
          <div class="p-5">
            <h3 class="text-xl font-extrabold text-slate-800 mb-1">${ex.exercise}</h3>
            <p class="text-5xl font-extrabold tracking-tight text-slate-900 mb-2">
              ${ex.weight_kg ? Math.round(ex.weight_kg) : "-"}<span class="text-2xl font-bold text-slate-500"> kg</span>
            </p>
            <p class="text-sm text-slate-500">
              ${fmtDate(ex.date)}${ex.reps ? ` · ${ex.reps} reps` : "" }
            </p>
          </div>
        </div>
      `;

      const back = `
        <div class="flip-card-back bg-slate-900 text-white flex flex-col justify-center items-center p-6">
          <p class="text-lg font-semibold mb-3">${ex.exercise}</p>
          <p class="text-sm opacity-80 mb-4">${fmtDate(ex.date)}<br>${ex.reps ?? "-"} reps</p>
          <a href="workout.html" class="bg-white text-slate-900 px-4 py-2 rounded-full font-semibold hover:bg-gray-100">
            Log more
          </a>
        </div>
      `;

      return `
        <article class="flip-card rounded-2xl" onclick="this.classList.toggle('flipped')">
          <div class="flip-card-inner">${front}${back}</div>
        </article>
      `;
    }

    function render(list) {
      grid.innerHTML = list.map(card).join("");
      emptyState.classList.toggle("hidden", list.length > 0);
    }

    function filterAndSort() {
      let list = [...rawData];
      const q = (searchInput.value || "").trim().toLowerCase();
      if (q) list = list.filter(x => (x.exercise || "").toLowerCase().includes(q));
      switch (sortSelect.value) {
        case "weight_asc":  list.sort((a,b)=>(a.weight_kg??0)-(b.weight_kg??0)); break;
        case "alpha_asc":   list.sort((a,b)=>String(a.exercise).localeCompare(String(b.exercise))); break;
        case "alpha_desc":  list.sort((a,b)=>String(b.exercise).localeCompare(String(a.exercise))); break;
        case "date_asc":    list.sort((a,b)=>new Date(a.date)-new Date(b.date)); break;
        case "date_desc":   list.sort((a,b)=>new Date(b.date)-new Date(a.date)); break;
        default:            list.sort((a,b)=>(b.weight_kg??0)-(a.weight_kg??0));
      }
      render(list);
    }

    async function load() {
      grid.innerHTML = `<div class="col-span-full text-center text-slate-400">Loading...</div>`;
      try {
        const r = await fetch(`${API_BASE}/api/bests`);
        if(!r.ok) throw new Error(await r.text());
        rawData = await r.json();
      } catch (e) {
        grid.innerHTML = `<div class="col-span-full text-center text-red-600">Failed to load: ${e.message}</div>`;
        return;
      }
      filterAndSort();
    }

    searchInput.addEventListener("input", filterAndSort);
    sortSelect.addEventListener("change", filterAndSort);
    load();
  </script>
</body>
</html>
